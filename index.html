<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <title>Roodkenley Terveus — Portfolio</title>
    <meta
      name="description"
      content="Roodkenley Terveus — Computer Science student portfolio: projects, about, and contact."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Roodkenley Terveus — Portfolio" />
    <meta property="og:description" content="Software engineer, English teacher, and interpreter based in Cap-Haïtien, Haiti." />

    <meta name="twitter:card" content="summary" />
    <link rel="canonical" href="https://roodkenleyportfolio.netlify.app/" />
    <script>
      // Apply the saved theme before first paint to avoid a dark/light flash.
      (function () {
        var theme;
        try { theme = localStorage.getItem("portfolio-theme"); } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
