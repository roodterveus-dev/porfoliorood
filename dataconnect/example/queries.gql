mutation CreateProfileData($data: Profile_Data!) @auth(level: USER) {
  profile_insert(data: $data)
}

mutation UpdateProfileData($id: UUID!, $data: Profile_Data!) @auth(level: USER) {
  profile_update(id: $id, data: $data)
}

mutation DeleteProfileData($id: UUID!) @auth(level: USER) {
  profile_delete(id: $id)
}

query GetProfile($id: UUID!) @auth(level: USER) {
  profile(id: $id) {
    fullName tagline email
  }
}

query ListProfiles @auth(level: PUBLIC, insecureReason: "Publicly visible profiles for portfolio display.") {
  profiles {
    fullName tagline
  }
}

mutation CreateProject($data: Project_Data!) @auth(level: USER) {
  project_insert(data: $data)
}

mutation UpdateProject($id: UUID!, $data: Project_Data!) @auth(level: USER) {
  project_update(id: $id, data: $data)
}

mutation DeleteProject($id: UUID!) @auth(level: USER) {
  project_delete(id: $id)
}

query GetProject($id: UUID!) @auth(level: PUBLIC, insecureReason: "Projects are public portfolio items.") {
  project(id: $id) {
    title description projectUrl
  }
}

query ListProjects @auth(level: PUBLIC, insecureReason: "Public project list for portfolio.") {
  projects(where: {isVisible: {eq: true}}) {
    title description
  }
}

